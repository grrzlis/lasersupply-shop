name = "lasersupply-shop"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "lasersupply-db"
database_id = "5a80c02a-8604-4e6e-b1fe-69bd067fc78c"

# Environment variables
[vars]
NEXT_PUBLIC_STORE_NAME = "LaserSupply.org"
NEXT_PUBLIC_STORE_TAGLINE = "The European Hub for Laser Maker Blanks & Materials"
NEXT_PUBLIC_SUPPORT_EMAIL = "support@lasersupply.org"
