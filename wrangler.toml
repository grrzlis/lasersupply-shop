name = "lasersupply-shop"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Point directly to the worker generated by @cloudflare/next-on-pages
main = ".vercel/output/static/_worker.js/index.js"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "lasersupply-db"
database_id = "a2612c2d-4892-4cef-9107-e353dfbaec12"

# Static assets directory
[assets]
directory = ".vercel/output/static"
binding = "ASSETS"

# Environment variables
[vars]
NEXT_PUBLIC_STORE_NAME = "LaserSupply.org"
NEXT_PUBLIC_STORE_TAGLINE = "The European Hub for Laser Maker Blanks & Materials"
NEXT_PUBLIC_SUPPORT_EMAIL = "support@lasersupply.org"
